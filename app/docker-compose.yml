version: '3.8'

services:
  web_app:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: slz-web-api
    restart: always
    expose:
      - "5000"

  nginx_proxy:
    image: nginx:alpine
    container_name: slz-nginx-ingress
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web_app
      - node_exporter

  node_exporter:
    image: prom/node-exporter:latest
    container_name: slz-node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'